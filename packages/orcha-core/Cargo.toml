[package]
name = "orcha-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orcha Core - Cycleround loop and task orchestration"

[dependencies]
orcha-sdk = { path = "../orcha-sdk", version = "0.1.0" }
orcha-llm = { path = "../orcha-llm", version = "0.1.0", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
tempfile = "3"
# SQLite 后端（M6，feature gate，bundled 编译 SQLite C 源码，零外部依赖）
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[features]
# 启用 LLM 驱动的 Sub-Agent（Planner/Worker/Reviewer 调真 LLM）。
# 默认关闭，CI 跑确定性实现；demo 路径 `--features llm` 启用。
default = []
llm = ["dep:orcha-llm"]
# 启用 SQLite 后端（M6，WAL + 跨进程锁，替代 FileTaskStore）
sqlite = ["dep:rusqlite"]

[target.'cfg(unix)'.dependencies]
# 仅 Unix 需要：execute_run_command 超时时用 killpg 杀整个进程组（#7）。
libc = "0.2"

[dev-dependencies]
# tempfile 同时作为 dev-dependency 以便测试中直接使用。
tempfile = "3"
