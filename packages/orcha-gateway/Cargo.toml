[package]
name = "orcha-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orcha Gateway - 独立进程，任务队列与跨进程通信入口"

[dependencies]
orcha-sdk = { path = "../orcha-sdk", version = "0.1.0" }
orcha-core = { path = "../orcha-core", version = "0.1.0" }
# orcha-llm 仅在启用 `llm` feature 时引入（避免无 LLM 场景拉 ureq）
orcha-llm = { path = "../orcha-llm", version = "0.1.0", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
default = ["llm"]
# 启用 SQLite 后端（M6，WAL + 跨进程锁）
sqlite = ["orcha-core/sqlite"]
# 启用 LLM 驱动调度（M7）：拉入 orcha-llm + orcha-core/llm，
# 让 Gateway 能构造 LlmCycleround。无 LLM 场景用 --no-default-features。
llm = ["dep:orcha-llm", "orcha-core/llm"]
